name: Build and Integration Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 02:17 EST / 03:17 EDT; avoid the busiest start-of-hour queue.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      only_if_upstream_changed:
        description: Skip Claw/Lobsters revisions that have already passed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_VERSION: "27.1"
  SIMULATOR_MODEL: "iPhone 17 Pro"
  SIMULATOR_OS: "26.2"
  LOBSTERS_DIRECTORY: .ci/lobsters

jobs:
  check-upstream:
    name: Check Lobsters revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lobsters_sha: ${{ steps.upstream.outputs.sha }}
      cache_key: ${{ steps.upstream.outputs.cache_key }}
      should_test: ${{ steps.decision.outputs.should_test }}
      matrix: ${{ steps.upstream.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve current Lobsters revision
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          CLAW_SHA: ${{ github.sha }}
        run: |
          sha="$(gh api repos/lobsters/lobsters/commits/main --jq .sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve the Lobsters main revision"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          release_sha="$(tr -d '\n' < .github/released-claw-ref)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "released-claw-ref must pin a full commit SHA"
            exit 1
          fi
          coverage="development"
          matrix="$(jq -cn --arg ref "$CLAW_SHA" '{include: [{name: "development", ref: $ref}]}')"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            coverage="development-and-release"
            matrix="$(jq -c --arg ref "$release_sha" '.include += [{name: "release-baseline", ref: $ref}]' <<< "$matrix")"
          fi
          echo "cache_key=lobsters-tested-v2-$coverage-$CLAW_SHA-$release_sha-$sha" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Look up successful compatibility check
        id: tested
        uses: actions/cache/restore@v6
        with:
          path: .ci/lobsters-tested
          key: ${{ steps.upstream.outputs.cache_key }}
          lookup-only: true

      - name: Decide whether to run the suite
        id: decision
        env:
          CHANGES_ONLY: ${{ github.event_name == 'schedule' || inputs.only_if_upstream_changed == true }}
          ALREADY_PASSED: ${{ steps.tested.outputs.cache-hit }}
          LOBSTERS_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          if [[ "$CHANGES_ONLY" == "true" && "$ALREADY_PASSED" == "true" ]]; then
            echo "should_test=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: this Claw revision already passed against Lobsters \`$LOBSTERS_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "Running the full suite against Lobsters \`$LOBSTERS_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  integration:
    name: ${{ matrix.name == 'development' && 'Build and Integration Test' || 'Released App Compatibility' }}
    needs: check-upstream
    if: needs.check-upstream.outputs.should_test == 'true'
    runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.check-upstream.outputs.matrix) }}
    env:
      COMPOSE_PROJECT_NAME: claw-lobsters-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}

    steps:
      - name: Checkout Claw
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}

      # Keep the fixture contract from the workflow revision when testing an
      # older app checkout. Never overwrite that checkout's parser or tests.
      - name: Checkout compatibility harness
        uses: actions/checkout@v6
        with:
          path: .ci/harness
          sparse-checkout: |
            .ci
            .github

      - name: Checkout resolved Lobsters revision
        uses: actions/checkout@v6
        with:
          repository: lobsters/lobsters
          ref: ${{ needs.check-upstream.outputs.lobsters_sha }}
          fetch-depth: 1
          path: ${{ env.LOBSTERS_DIRECTORY }}

      - name: Record Lobsters revision
        working-directory: ${{ env.LOBSTERS_DIRECTORY }}
        run: |
          {
            echo "### ${{ matrix.name }} compatibility"
            echo "Claw commit: \`${{ matrix.ref }}\`"
            echo "### Lobsters under test"
            echo
            echo "Commit: \`$(git rev-parse HEAD)\`"
            echo
            git log -1 --format='Subject: %s'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Isolate Lobsters network port
        working-directory: ${{ env.LOBSTERS_DIRECTORY }}
        shell: bash
        run: |
          ruby -ryaml -e '
            path = ARGV.fetch(0)
            compose = YAML.safe_load(File.read(path), aliases: true)
            compose.fetch("services").fetch("app")["ports"] = [
              {"target" => 3000, "host_ip" => "127.0.0.1"}
            ]
            # Development regenerates inline partials on disk. Multiple Puma
            # workers can race and truncate those generated view files.
            app = compose.fetch("services").fetch("app")
            app["environment"] ||= {}
            app["environment"]["PUMA_WORKERS"] = "0"
            app["environment"]["RAILS_MAX_THREADS"] = "1"
            File.write(path, YAML.dump(compose))
          ' docker-compose.yaml

      - name: Configure Docker for unattended public image pulls
        timeout-minutes: 2
        shell: bash
        run: |
          ruby -rjson -rtmpdir -rfileutils - <<'RUBY'
          source = ENV.fetch("DOCKER_CONFIG", File.join(Dir.home, ".docker"))
          destination = Dir.mktmpdir("claw-docker-", ENV.fetch("RUNNER_TEMP"))
          path = File.join(source, "config.json")
          config = File.exist?(path) ? JSON.parse(File.read(path)) : {}
          config.delete("credsStore")
          config.delete("credHelpers")
          # An explicit anonymous entry also prevents Docker from auto-detecting
          # the macOS Keychain helper when the runner has no interactive session.
          config["auths"] = {"https://index.docker.io/v1/" => {}}
          File.write(File.join(destination, "config.json"), JSON.generate(config))
          # Preserve the selected daemon and locally installed Compose/Buildx.
          contexts = File.join(source, "contexts")
          FileUtils.cp_r(contexts, destination) if File.directory?(contexts)
          plugins = File.join(source, "cli-plugins")
          if File.directory?(plugins)
            File.symlink(File.realpath(plugins), File.join(destination, "cli-plugins"))
          end
          File.open(ENV.fetch("GITHUB_ENV"), "a") do |file|
            file.puts "DOCKER_CONFIG=#{destination}"
          end
          RUBY

      - name: Build latest Lobsters image
        timeout-minutes: 30
        working-directory: ${{ env.LOBSTERS_DIRECTORY }}
        run: docker compose build --pull --no-cache app

      - name: Initialize Lobsters test data
        working-directory: ${{ env.LOBSTERS_DIRECTORY }}
        run: docker compose run --rm app bin/setup

      - name: Create Lobsters UI test fixtures
        working-directory: ${{ env.LOBSTERS_DIRECTORY }}
        shell: bash
        run: |
          docker compose run --rm -T app bin/rails runner - <<'RUBY'
          author = User.find_by!(username: "System")
          test_user = User.find_by!(username: "test")
          tag = Tag.find_by!(tag: "test")
          story = Story.find_or_create_by!(title: "Claw UI Vote Fixture") do |fixture|
            fixture.user = author
            fixture.url = "https://example.com/claw-ui-vote-fixture"
            fixture.tags = [tag]
          end
          profile_story = Story.find_or_initialize_by(
            title: "Claw UI Profile Story Fixture"
          )
          profile_story.user = test_user
          profile_story.url = "https://example.com/claw-ui-profile-story-fixture"
          profile_story.description = ""
          profile_story.tags = [tag]
          profile_story.save!
          12.times do |index|
            scroll_story = Story.find_or_initialize_by(
              title: "Claw UI Profile Scroll Fixture #{index + 1}"
            )
            scroll_story.user = test_user
            scroll_story.url = "https://example.com/claw-ui-profile-scroll-#{index + 1}"
            scroll_story.description = ""
            scroll_story.tags = [tag]
            scroll_story.save!
          end
          Vote.where(user: test_user, story: story, comment_id: nil).delete_all
          RUBY

          story_id="$(
            docker compose run --rm -T app bin/rails runner \
              'puts Story.find_by!(title: "Claw UI Vote Fixture").short_id' \
              | tail -n 1
          )"
          if [[ ! "$story_id" =~ ^[a-z0-9]+$ ]]; then
            echo "Unable to determine the Lobsters UI fixture short ID: $story_id"
            exit 1
          fi
          echo "CLAW_UI_TEST_STORY_ID=$story_id" >> "$GITHUB_ENV"

          profile_story_id="$(
            docker compose run --rm -T app bin/rails runner \
              'puts Story.find_by!(title: "Claw UI Profile Story Fixture").short_id' \
              | tail -n 1
          )"
          if [[ ! "$profile_story_id" =~ ^[a-z0-9]+$ ]]; then
            echo "Unable to determine the profile fixture short ID: $profile_story_id"
            exit 1
          fi
          echo "CLAW_UI_TEST_PROFILE_STORY_ID=$profile_story_id" >> "$GITHUB_ENV"

      - name: Seed parser compatibility fixture
        working-directory: ${{ env.LOBSTERS_DIRECTORY }}
        run: docker compose run --rm -T app bin/rails runner - < ../harness/.ci/seed-parser-fixture.rb

      - name: Install local rate-limit regression fixture
        run: cp .ci/harness/.github/lobsters-rate-limit-fixture.rb "$LOBSTERS_DIRECTORY/config/initializers/claw_rate_limit_fixture.rb"

      - name: Start Lobsters
        timeout-minutes: 5
        working-directory: ${{ env.LOBSTERS_DIRECTORY }}
        shell: bash
        run: |
          make docker-serve > "$RUNNER_TEMP/lobsters-serve.log" 2>&1 &
          server_pid=$!
          port=""
          for _ in {1..120}; do
            address="$(docker compose port app 3000 2>/dev/null || true)"
            port="${address##*:}"
            if [[ "$port" =~ ^[0-9]+$ ]]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lobsters-serve.log"
              exit 1
            fi
            sleep 2
          done
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            cat "$RUNNER_TEMP/lobsters-serve.log"
            echo "Unable to determine the Lobsters host port from: $address"
            exit 1
          fi
          base_url="http://127.0.0.1:$port"
          echo "LOBSTERS_BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "CLAW_UI_TEST_BASE_URL=$base_url" >> "$GITHUB_ENV"

      - name: Wait for Lobsters
        working-directory: ${{ env.LOBSTERS_DIRECTORY }}
        shell: bash
        run: |
          ready=false
          for attempt in {1..120}; do
            if curl --fail --silent "$LOBSTERS_BASE_URL/" >/dev/null; then
              ready=true
              break
            fi
            if (( attempt % 15 == 0 )); then
              echo "Still waiting for Lobsters ($attempt/120)"
            fi
            sleep 2
          done

          if [[ "$ready" != true ]]; then
            docker compose logs --no-color
            exit 1
          fi

      - name: Use configured Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Prepare Xcode
        shell: bash
        run: |
          xcodebuild -downloadComponent MetalToolchain
          if ! xcodebuild -showsdks | grep -q iphonesimulator; then
            xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup simulator
        id: simulator
        uses: futureware-tech/simulator-action@v5
        with:
          model: ${{ env.SIMULATOR_MODEL }}
          os: iOS
          os_version: ${{ env.SIMULATOR_OS }}
          erase_before_boot: true
          wait_for_boot: true
          shutdown_after_job: false

      - name: Run unit, integration, and UI tests
        shell: bash
        run: |
          mkdir -p results
          simulator_id='${{ steps.simulator.outputs.udid }}'
          # A freshly erased iOS 26 Simulator can fail the first WebKit test
          # host during process startup. Retry failures in a new host process;
          # deterministic failures still exhaust all three attempts.
          xcodebuild \
            -project claw.xcodeproj \
            -scheme claw \
            -configuration Debug \
            -destination-timeout 60 \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            -resultBundlePath results/ClawTests.xcresult \
            CLAW_UI_TEST_BASE_URL="$CLAW_UI_TEST_BASE_URL" \
            CLAW_UI_TEST_STORY_ID="$CLAW_UI_TEST_STORY_ID" \
            CLAW_UI_TEST_PROFILE_STORY_ID="$CLAW_UI_TEST_PROFILE_STORY_ID" \
            test

      - name: Capture Lobsters diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p results
          if [[ -f "$LOBSTERS_DIRECTORY/docker-compose.yaml" ]]; then
            docker compose \
              -f "$LOBSTERS_DIRECTORY/docker-compose.yaml" \
              logs --no-color > results/lobsters.log 2>&1
            docker compose \
              -f "$LOBSTERS_DIRECTORY/docker-compose.yaml" \
              ps > results/lobsters-containers.txt 2>&1
          fi

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: integration-test-results-${{ matrix.name }}
          path: results
          if-no-files-found: ignore

      - name: Stop Lobsters
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f "$LOBSTERS_DIRECTORY/docker-compose.yaml" ]]; then
            docker compose \
              -f "$LOBSTERS_DIRECTORY/docker-compose.yaml" \
              down --volumes --rmi local --remove-orphans
          fi

  record-success:
    name: Record successful compatibility check
    needs: [check-upstream, integration]
    # Never mark a failed/cancelled run as tested. Keeping this on the same
    # runner OS as the lookup also keeps the cache format consistent.
    if: needs.integration.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write tested revisions
        env:
          CLAW_SHA: ${{ github.sha }}
          LOBSTERS_SHA: ${{ needs.check-upstream.outputs.lobsters_sha }}
        run: |
          mkdir -p .ci/lobsters-tested
          printf '%s\n%s\n' "$CLAW_SHA" "$LOBSTERS_SHA" > .ci/lobsters-tested/revisions

      - name: Save successful compatibility check
        uses: actions/cache/save@v6
        with:
          path: .ci/lobsters-tested
          key: ${{ needs.check-upstream.outputs.cache_key }}
